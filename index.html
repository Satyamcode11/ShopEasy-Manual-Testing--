<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - E-Commerce Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ShopEasy</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#cart">Cart (<span id="cartCount">0</span>)</a>
      <a href="#login">Login</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h2>Welcome to ShopEasy</h2>
      <p>Your simple e-commerce testing application.</p>
      <a class="button" href="#products">Shop Now</a>
    </section>

    <section id="login" class="card">
      <h2>Login</h2>
      <form id="loginForm">
        <label>Username</label>
        <input id="username" type="text" placeholder="Enter username">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">
        <button type="submit">Login</button>
      </form>
      <p id="loginMessage"></p>
    </section>

    <section id="products">
      <h2>Products</h2>
      <input id="search" class="search" type="text" placeholder="Search products...">
      <div id="productList" class="products"></div>
    </section>

    <section id="cart" class="card">
      <h2>Shopping Cart</h2>
      <div id="cartItems"></div>
      <h3>Total: ₹<span id="cartTotal">0</span></h3>
      <button id="checkoutBtn">Checkout</button>
      <p id="checkoutMessage"></p>
    </section>
  </main>

  <footer>
    <p>ShopEasy Demo Application — For Manual Testing Practice</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
